[package]
name = "team-deck"
version = "0.1.0"
description = "Local-first Windows desktop app for peer-to-peer teammate discovery and zero-cloud direct file transfer"
authors = ["Team Deck Core Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "team_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
dirs = "5.0"

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
incremental = false
codegen-units = 1
